version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: eu-west-2
    ECR_REPOSITORY: it-asset-register

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing Asset Register dependencies"
      - npm ci

  pre_build:
    commands:
      - echo "Authenticating with Amazon ECR"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Starting Asset Register for automated testing"
      - node server.js > /tmp/asset-register.log 2>&1 & echo $! > /tmp/asset-register.pid
      - sleep 3
      - npm test
      - kill $(cat /tmp/asset-register.pid) || true

      - echo "Building Asset Register Docker image"
      - docker build -t $ECR_URI:$CODEBUILD_BUILD_NUMBER .

  post_build:
    commands:
      - echo "Pushing Asset Register image to Amazon ECR"
      - docker push $ECR_URI:$CODEBUILD_BUILD_NUMBER
      - docker tag $ECR_URI:$CODEBUILD_BUILD_NUMBER $ECR_URI:latest
      - docker push $ECR_URI:latest
      - echo $ECR_URI:$CODEBUILD_BUILD_NUMBER > image-uri.txt

      - echo "Deploying Asset Register to Kubernetes using AWS Systems Manager"
      - INSTANCE_ID="i-018f836ce766ff6f4"

      - >
        COMMAND_ID=$(aws ssm send-command
        --instance-ids "$INSTANCE_ID"
        --document-name "AWS-RunShellScript"
        --parameters commands="[
        \"aws ecr get-login-password --region $AWS_DEFAULT_REGION | sudo k3s ctr images pull --user AWS:\\$(aws ecr get-login-password --region $AWS_DEFAULT_REGION) $ECR_URI:$CODEBUILD_BUILD_NUMBER\",
        \"sudo k3s kubectl create deployment it-asset-register --image=$ECR_URI:$CODEBUILD_BUILD_NUMBER --dry-run=client -o yaml | sudo k3s kubectl apply -f -\",
        \"sudo k3s kubectl set image deployment/it-asset-register it-asset-register=$ECR_URI:$CODEBUILD_BUILD_NUMBER\",
        \"sudo k3s kubectl set env deployment/it-asset-register NODE_ENV=production PORT=3000\",
        \"sudo k3s kubectl expose deployment it-asset-register --name=it-asset-register-service --type=NodePort --port=3000 --target-port=3000 --dry-run=client -o yaml | sudo k3s kubectl apply -f -\",
        \"sudo k3s kubectl rollout status deployment/it-asset-register --timeout=120s\",
        \"sudo k3s kubectl get pods\",
        \"sudo k3s kubectl get service it-asset-register-service\"
        ]"
        --query "Command.CommandId"
        --output text)

      - echo "SSM command ID $COMMAND_ID"
      - aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
      - aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - echo "Asset Register CodeBuild completed successfully"

artifacts:
  files:
    - image-uri.txt
